spring:
  application:
    name: spring-boot-auth-demo
  datasource:
    url: jdbc:h2:mem:auth-db
    username: user
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080